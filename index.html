<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Click & Go - Запись</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%); font-family: system-ui, sans-serif; }
        .card { transition: all 0.2s ease; cursor: pointer; }
        .card.selected { border-color: #3b82f6; background-color: #1e293b; box-shadow: 0 0 0 2px #3b82f6; }
        .time-slot:active { transform: scale(0.97); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        ::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
    </style>
</head>
<body class="p-4 pb-8 text-white">
    <div class="max-w-md mx-auto">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-black bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">CLICK & GO</h1>
            <p class="text-gray-400 text-sm">Онлайн-запись к специалистам</p>
        </div>

        <!-- Шаг 1 -->
        <div class="mb-6">
            <div class="flex items-center gap-2 mb-2">
                <span class="w-6 h-6 bg-blue-600 rounded-full flex items-center justify-center text-xs font-bold">1</span>
                <span class="font-semibold text-gray-300">Выберите услугу</span>
            </div>
            <div id="services" class="space-y-2">
                <div class="card bg-zinc-900 border-2 border-zinc-700 p-4 rounded-xl" data-service="Премиум Сервис" data-price="2500" data-duration="60">
                    <div class="flex justify-between"><span>⭐ Премиум Сервис</span><span class="text-blue-400 font-bold">2500 ₽</span></div>
                    <div class="text-xs text-gray-500 mt-1">⏱ 60 минут</div>
                </div>
                <div class="card bg-zinc-900 border-2 border-zinc-700 p-4 rounded-xl" data-service="Стандартный Пакет" data-price="1500" data-duration="45">
                    <div class="flex justify-between"><span>⚡ Стандартный Пакет</span><span class="text-blue-400 font-bold">1500 ₽</span></div>
                    <div class="text-xs text-gray-500 mt-1">⏱ 45 минут</div>
                </div>
                <div class="card bg-zinc-900 border-2 border-zinc-700 p-4 rounded-xl" data-service="Экспресс Услуга" data-price="900" data-duration="30">
                    <div class="flex justify-between"><span>⚡ Экспресс Услуга</span><span class="text-blue-400 font-bold">900 ₽</span></div>
                    <div class="text-xs text-gray-500 mt-1">⏱ 30 минут</div>
                </div>
            </div>
        </div>

        <!-- Шаг 2 -->
        <div class="mb-6">
            <div class="flex items-center gap-2 mb-2">
                <span class="w-6 h-6 bg-blue-600 rounded-full flex items-center justify-center text-xs font-bold">2</span>
                <span class="font-semibold text-gray-300">Выберите специалиста</span>
            </div>
            <div id="masters" class="grid grid-cols-2 gap-3">
                <div class="card bg-zinc-900 border-2 border-zinc-700 p-3 rounded-xl text-center" data-master="Алексей (Ведущий специалист)">
                    <div class="font-bold">Алексей</div><div class="text-xs text-gray-400">Ведущий</div>
                </div>
                <div class="card bg-zinc-900 border-2 border-zinc-700 p-3 rounded-xl text-center" data-master="Мария (Специалист)">
                    <div class="font-bold">Мария</div><div class="text-xs text-gray-400">Специалист</div>
                </div>
            </div>
        </div>

        <!-- Шаг 3 -->
        <div class="mb-6">
            <div class="flex items-center gap-2 mb-2">
                <span class="w-6 h-6 bg-blue-600 rounded-full flex items-center justify-center text-xs font-bold">3</span>
                <span class="font-semibold text-gray-300">Выберите дату</span>
            </div>
            <input type="date" id="datePicker" class="w-full bg-zinc-900 border-2 border-zinc-700 text-white p-3 rounded-xl focus:border-blue-500 outline-none" min="">
        </div>

        <!-- Шаг 4 -->
        <div id="timeStep" class="mb-6 hidden">
            <div class="flex items-center gap-2 mb-2">
                <span class="w-6 h-6 bg-blue-600 rounded-full flex items-center justify-center text-xs font-bold">4</span>
                <span class="font-semibold text-gray-300">Выберите время</span>
            </div>
            <div id="timeSlots" class="grid grid-cols-4 gap-2"></div>
            <div id="loadingSlots" class="text-center text-gray-400 text-sm py-4 hidden">Загрузка свободного времени...</div>
        </div>

        <button id="submitBtn" disabled class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl transition-all disabled:bg-gray-700 disabled:cursor-not-allowed">
            Записаться
        </button>
    </div>

    <script>
        const API_BASE = "";  // пустая строка – запросы на тот же домен
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();

        let selectedService = null, selectedMaster = null, selectedDate = "", selectedTime = "";
        const datePicker = document.getElementById('datePicker');
        const timeStep = document.getElementById('timeStep');
        const timeSlotsDiv = document.getElementById('timeSlots');
        const loadingSlots = document.getElementById('loadingSlots');
        const submitBtn = document.getElementById('submitBtn');

        const today = new Date().toISOString().split('T')[0];
        datePicker.min = today;

        document.querySelectorAll('#services .card').forEach(card => {
            card.addEventListener('click', () => {
                document.querySelectorAll('#services .card').forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                selectedService = {
                    name: card.dataset.service,
                    price: card.dataset.price,
                    duration: parseInt(card.dataset.duration)
                };
                checkEnableSubmit();
            });
        });

        document.querySelectorAll('#masters .card').forEach(card => {
            card.addEventListener('click', () => {
                document.querySelectorAll('#masters .card').forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                selectedMaster = card.dataset.master;
                selectedTime = "";
                if (selectedDate) loadSlots(selectedDate);
                checkEnableSubmit();
            });
        });

        datePicker.addEventListener('change', (e) => {
            selectedDate = e.target.value;
            selectedTime = "";
            if (selectedDate && selectedMaster) loadSlots(selectedDate);
            else timeStep.classList.add('hidden');
            checkEnableSubmit();
        });

        async function loadSlots(date) {
            if (!selectedMaster || !selectedService) return;
            timeStep.classList.remove('hidden');
            timeSlotsDiv.innerHTML = '';
            loadingSlots.classList.remove('hidden');
            try {
                const url = `${API_BASE}/api/slots?date=${date}&master=${encodeURIComponent(selectedMaster)}&duration=${selectedService.duration}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error("Ошибка сервера");
                const data = await response.json();
                const slots = data.slots || [];
                loadingSlots.classList.add('hidden');
                if (slots.length === 0) {
                    timeSlotsDiv.innerHTML = '<div class="col-span-4 text-center text-gray-400 py-4">Нет свободного времени</div>';
                    selectedTime = "";
                } else {
                    slots.forEach(slot => {
                        const btn = document.createElement('div');
                        btn.className = 'time-slot bg-zinc-900 border-2 border-zinc-700 p-3 rounded-xl text-center text-sm font-mono cursor-pointer hover:border-blue-500 transition';
                        btn.innerText = slot;
                        btn.addEventListener('click', () => {
                            document.querySelectorAll('#timeSlots .time-slot').forEach(b => b.classList.remove('border-blue-500', 'bg-blue-950'));
                            btn.classList.add('border-blue-500', 'bg-blue-950');
                            selectedTime = slot;
                            checkEnableSubmit();
                        });
                        timeSlotsDiv.appendChild(btn);
                    });
                }
            } catch (err) {
                loadingSlots.classList.add('hidden');
                timeSlotsDiv.innerHTML = '<div class="col-span-4 text-center text-red-400 py-4">⚠️ Ошибка соединения с сервером</div>';
                selectedTime = "";
            }
        }

        function checkEnableSubmit() {
            const ready = selectedService && selectedMaster && selectedDate && selectedTime;
            submitBtn.disabled = !ready;
        }

        async function sendOrder() {
            if (!selectedService || !selectedMaster || !selectedDate || !selectedTime) return;
            const user = tg.initDataUnsafe.user || {};
            const orderData = {
                user_id: user.id || 0,
                username: user.username || 'user',
                full_name: `${user.first_name || ''} ${user.last_name || ''}`.trim(),
                service: `${selectedService.name} (${selectedService.price}₽)`,
                master: selectedMaster,
                date: selectedDate,
                time_slot: selectedTime
            };
            submitBtn.disabled = true;
            submitBtn.innerText = "Отправка...";
            try {
                const response = await fetch(`${API_BASE}/api/order`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });
                if (response.ok) {
                    tg.showAlert("✅ Запись отправлена! Ожидайте подтверждения.");
                    setTimeout(() => tg.close(), 1500);
                } else {
                    const err = await response.json();
                    tg.showAlert("❌ Ошибка: " + (err.message || "Не удалось записаться"));
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Записаться";
                }
            } catch (error) {
                tg.showAlert("❌ Ошибка соединения с сервером.");
                submitBtn.disabled = false;
                submitBtn.innerText = "Записаться";
            }
        }
        submitBtn.onclick = sendOrder;
    </script>
</body>
</html>
