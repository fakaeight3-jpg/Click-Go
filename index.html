<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click & Go</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #111; color: white; }
        .card { background: #222; margin: 10px 0; padding: 15px; border-radius: 12px; cursor: pointer; }
        .selected { border: 2px solid blue; background: #1a2a3a; }
        button { background: blue; color: white; border: none; padding: 15px; width: 100%; border-radius: 12px; font-size: 18px; }
        .time-slot { display: inline-block; margin: 5px; padding: 10px; background: #333; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>CLICK & GO</h1>
    <div>
        <h3>1. Услуга</h3>
        <div id="services">
            <div class="card" data-service="Премиум Сервис" data-price="2500" data-duration="60">⭐ Премиум Сервис – 2500₽ (60 мин)</div>
            <div class="card" data-service="Стандартный Пакет" data-price="1500" data-duration="45">⚡ Стандартный Пакет – 1500₽ (45 мин)</div>
            <div class="card" data-service="Экспресс Услуга" data-price="900" data-duration="30">⏱ Экспресс Услуга – 900₽ (30 мин)</div>
        </div>
    </div>
    <div>
        <h3>2. Специалист</h3>
        <div id="masters">
            <div class="card" data-master="Алексей (Ведущий специалист)">Алексей (Ведущий)</div>
            <div class="card" data-master="Мария (Специалист)">Мария (Специалист)</div>
        </div>
    </div>
    <div>
        <h3>3. Дата</h3>
        <input type="date" id="datePicker" style="padding: 10px; width: 100%;">
    </div>
    <div id="timeSlotsDiv" style="margin-top: 20px;"></div>
    <button id="submitBtn" disabled>Записаться</button>

    <script>
        const API_BASE = "";
        const tg = window.Telegram.WebApp;
        tg.expand();

        let selectedService = null, selectedMaster = null, selectedDate = "", selectedTime = "";

        document.querySelectorAll('#services .card').forEach(el => {
            el.onclick = () => {
                document.querySelectorAll('#services .card').forEach(c => c.classList.remove('selected'));
                el.classList.add('selected');
                selectedService = { name: el.dataset.service, price: el.dataset.price, duration: parseInt(el.dataset.duration) };
                enableButton();
            };
        });

        document.querySelectorAll('#masters .card').forEach(el => {
            el.onclick = () => {
                document.querySelectorAll('#masters .card').forEach(c => c.classList.remove('selected'));
                el.classList.add('selected');
                selectedMaster = el.dataset.master;
                if (selectedDate) loadSlots();
                enableButton();
            };
        });

        const datePicker = document.getElementById('datePicker');
        datePicker.min = new Date().toISOString().split('T')[0];
        datePicker.onchange = () => {
            selectedDate = datePicker.value;
            if (selectedMaster) loadSlots();
            enableButton();
        };

        async function loadSlots() {
            if (!selectedMaster || !selectedService) return;
            const url = `${API_BASE}/api/slots?date=${selectedDate}&master=${encodeURIComponent(selectedMaster)}&duration=${selectedService.duration}`;
            try {
                const resp = await fetch(url);
                const data = await resp.json();
                const slots = data.slots || [];
                const container = document.getElementById('timeSlotsDiv');
                container.innerHTML = '<h3>4. Время</h3>';
                slots.forEach(slot => {
                    const btn = document.createElement('div');
                    btn.className = 'time-slot';
                    btn.innerText = slot;
                    btn.onclick = () => {
                        document.querySelectorAll('.time-slot').forEach(b => b.style.background = '#333');
                        btn.style.background = 'blue';
                        selectedTime = slot;
                        enableButton();
                    };
                    container.appendChild(btn);
                });
            } catch(e) {
                document.getElementById('timeSlotsDiv').innerHTML = '<p style="color:red;">⚠️ Ошибка соединения с сервером</p>';
            }
        }

        function enableButton() {
            const btn = document.getElementById('submitBtn');
            btn.disabled = !(selectedService && selectedMaster && selectedDate && selectedTime);
        }

        document.getElementById('submitBtn').onclick = async () => {
            const user = tg.initDataUnsafe.user || {};
            const orderData = {
                user_id: user.id,
                username: user.username,
                full_name: `${user.first_name || ''} ${user.last_name || ''}`,
                service: `${selectedService.name} (${selectedService.price}₽)`,
                master: selectedMaster,
                date: selectedDate,
                time_slot: selectedTime
            };
            const btn = document.getElementById('submitBtn');
            btn.innerText = 'Отправка...';
            try {
                const resp = await fetch(`${API_BASE}/api/order`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });
                if (resp.ok) {
                    tg.showAlert('✅ Запись отправлена!');
                    setTimeout(() => tg.close(), 1500);
                } else {
                    tg.showAlert('❌ Ошибка при отправке');
                }
            } catch(e) {
                tg.showAlert('❌ Ошибка соединения');
            }
            btn.innerText = 'Записаться';
        };
    </script>
</body>
</html>
