<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyBook - Запись онлайн</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #121212; color: #ffffff; }
        .service-card, .master-card, .time-slot {
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .service-card.selected, .master-card.selected, .time-slot.selected {
            border-color: #3b82f6;
            background-color: #1e293b;
            box-shadow: 0 0 0 2px #3b82f6;
        }
        .time-slot:active { transform: scale(0.98); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body class="p-4 pb-8">
    <div class="max-w-md mx-auto">
        <h1 class="text-3xl font-bold text-center text-blue-500 mb-2">EASYBOOK</h1>
        <p class="text-center text-gray-400 text-sm mb-6">Онлайн-запись к специалистам</p>

        <!-- Шаг 1: Услуга -->
        <div class="mb-6">
            <label class="block text-sm font-semibold text-gray-300 mb-3">1. ВЫБЕРИТЕ УСЛУГУ</label>
            <div id="services" class="space-y-2">
                <div class="service-card bg-zinc-900 border-2 border-zinc-800 p-4 rounded-xl" data-service="Премиум Сервис" data-price="2500" data-duration="60">
                    <div class="flex justify-between">
                        <span>⭐ Премиум Сервис</span>
                        <span class="text-blue-400 font-bold">2500₽</span>
                    </div>
                    <div class="text-xs text-gray-500 mt-1">⏱ 60 минут</div>
                </div>
                <div class="service-card bg-zinc-900 border-2 border-zinc-800 p-4 rounded-xl" data-service="Стандартный Пакет" data-price="1500" data-duration="45">
                    <div class="flex justify-between">
                        <span>⚡ Стандартный Пакет</span>
                        <span class="text-blue-400 font-bold">1500₽</span>
                    </div>
                    <div class="text-xs text-gray-500 mt-1">⏱ 45 минут</div>
                </div>
                <div class="service-card bg-zinc-900 border-2 border-zinc-800 p-4 rounded-xl" data-service="Экспресс Услуга" data-price="900" data-duration="30">
                    <div class="flex justify-between">
                        <span>⏱️ Экспресс Услуга</span>
                        <span class="text-blue-400 font-bold">900₽</span>
                    </div>
                    <div class="text-xs text-gray-500 mt-1">⏱ 30 минут</div>
                </div>
            </div>
        </div>

        <!-- Шаг 2: Мастер -->
        <div class="mb-6">
            <label class="block text-sm font-semibold text-gray-300 mb-3">2. ВЫБЕРИТЕ СПЕЦИАЛИСТА</label>
            <div id="masters" class="grid grid-cols-2 gap-2">
                <div class="master-card bg-zinc-900 border-2 border-zinc-800 p-3 rounded-xl text-center" data-master="Алексей (Ведущий)">
                    <div class="font-semibold">Алексей</div>
                    <div class="text-xs text-gray-400">Ведущий</div>
                </div>
                <div class="master-card bg-zinc-900 border-2 border-zinc-800 p-3 rounded-xl text-center" data-master="Мария (Специалист)">
                    <div class="font-semibold">Мария</div>
                    <div class="text-xs text-gray-400">Специалист</div>
                </div>
            </div>
        </div>

        <!-- Шаг 3: Дата -->
        <div class="mb-6">
            <label class="block text-sm font-semibold text-gray-300 mb-3">3. ВЫБЕРИТЕ ДАТУ</label>
            <input type="date" id="date" class="w-full bg-zinc-900 border-2 border-zinc-800 text-white p-3 rounded-xl" min="">
        </div>

        <!-- Шаг 4: Время -->
        <div class="mb-6" id="time-section" style="display: none;">
            <label class="block text-sm font-semibold text-gray-300 mb-3">4. ВЫБЕРИТЕ ВРЕМЯ</label>
            <div id="time-slots" class="grid grid-cols-4 gap-2"></div>
        </div>

        <!-- Кнопка отправки -->
        <button id="submitBtn" onclick="sendOrder()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl transition-all disabled:opacity-50">
            📅 Записаться
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();

        let selectedService = null;
        let selectedMaster = null;
        let selectedTime = null;

        // Выбор услуги
        document.querySelectorAll('.service-card').forEach(card => {
            card.onclick = () => {
                document.querySelectorAll('.service-card').forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                selectedService = {
                    name: card.dataset.service,
                    price: card.dataset.price,
                    duration: parseInt(card.dataset.duration)
                };
            };
        });

        // Выбор мастера
        document.querySelectorAll('.master-card').forEach(card => {
            card.onclick = () => {
                document.querySelectorAll('.master-card').forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                selectedMaster = card.dataset.master;
            };
        });

        // Установка минимальной даты (сегодня)
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('date').min = today;

        // Генерация слотов при выборе даты
        document.getElementById('date').onchange = async function() {
            if (!selectedService) {
                alert('Сначала выберите услугу!');
                return;
            }
            
            const date = this.value;
            const master = selectedMaster;
            
            if (!master) {
                alert('Выберите мастера!');
                return;
            }
            
            // Здесь должен быть запрос к серверу для получения свободных слотов
            // Для демо генерируем слоты на клиенте
            generateMockSlots(date, master, selectedService.duration);
        };
        
        function generateMockSlots(date, master, duration) {
            const slots = [];
            // Генерируем слоты с 10:00 до 20:00 с шагом 30 минут
            for (let hour = 10; hour < 20; hour++) {
                for (let minute of [0, 30]) {
                    const time = `${hour.toString().padStart(2, '0')}:${minute.toString().padStart(2, '0')}`;
                    // Проверяем, что услуга помещается до 20:00
                    const [h, m] = time.split(':').map(Number);
                    const endHour = h + Math.floor((m + duration) / 60);
                    if (endHour < 20 || (endHour === 20 && (m + duration) % 60 === 0)) {
                        slots.push(time);
                    }
                }
            }
            
            const container = document.getElementById('time-slots');
            container.innerHTML = '';
            
            slots.forEach(slot => {
                const btn = document.createElement('div');
                btn.className = 'time-slot bg-zinc-900 border-2 border-zinc-800 p-3 rounded-xl text-center text-sm font-mono';
                btn.textContent = slot;
                btn.onclick = () => {
                    document.querySelectorAll('.time-slot').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    selectedTime = slot;
                };
                container.appendChild(btn);
            });
            
            document.getElementById('time-section').style.display = 'block';
        }

        async function sendOrder() {
            if (!selectedService) {
                alert('Выберите услугу!');
                return;
            }
            if (!selectedMaster) {
                alert('Выберите специалиста!');
                return;
            }
            
            const date = document.getElementById('date').value;
            if (!date) {
                alert('Выберите дату!');
                return;
            }
            
            if (!selectedTime) {
                alert('Выберите время!');
                return;
            }
            
            const user = tg.initDataUnsafe.user || {};
            const orderData = {
                user_id: user.id,
                username: user.username || 'unknown',
                full_name: `${user.first_name || ''} ${user.last_name || ''}`.trim(),
                service: `${selectedService.name} (${selectedService.price}₽)`,
                master: selectedMaster,
                date: date,
                time_slot: selectedTime
            };
            
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'Отправка...';
            
            try {
                const response = await fetch('https://ВАШ-АДРЕС.ngrok-free.dev/api/order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });
                
                if (response.ok) {
                    tg.showAlert('✅ Заявка отправлена! Ожидайте подтверждения.');
                    setTimeout(() => tg.close(), 1500);
                } else {
                    const error = await response.json();
                    tg.showAlert(error.message || 'Ошибка!');
                }
            } catch (e) {
                tg.showAlert('❌ Ошибка соединения!');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Записаться';
            }
        }
    </script>
</body>
</html>
